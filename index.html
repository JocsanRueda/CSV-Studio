<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Herramienta local para limpiar archivos CSV.">
  <title>Limpiador CSV</title>
  <script>
    (() => {
      const saved = localStorage.getItem('csv-theme');
      if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">@custom-variant dark (&:where(.dark, .dark *));</style>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="relative min-h-screen overflow-x-hidden bg-[#eef3f7] text-slate-950 antialiased selection:bg-sky-200 dark:bg-[#101820] dark:text-slate-100 dark:selection:bg-sky-900">
  <div class="fixed inset-x-0 top-0 z-50 h-0.5 bg-gradient-to-r from-transparent via-sky-500 to-transparent" aria-hidden="true"></div>
  <div id="cursorGlow" class="pointer-events-none fixed inset-0 z-0" aria-hidden="true"></div>

  <main class="relative mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
    <header class="mb-6 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="grid h-11 w-11 place-items-center rounded-lg bg-gradient-to-br from-slate-700 via-slate-800 to-slate-950 text-white shadow-lg shadow-slate-950/20" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-6 w-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 2.75h7l4.25 4.25v14.25H7A2.25 2.25 0 0 1 4.75 19V5A2.25 2.25 0 0 1 7 2.75Z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14 2.75V7h4.25M8 11h6.5M8 14.5h6.5M8 18h4"/></svg>
        </div>
        <div><p class="text-xs font-bold uppercase tracking-[.2em] text-sky-700 dark:text-sky-400" data-i18n="eyebrow"></p><h1 class="text-xl font-extrabold tracking-tight sm:text-2xl" data-i18n="appTitle"></h1></div>
      </div>
      <button id="themeBtn" type="button" class="rounded-lg border border-slate-200 bg-white p-3 text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:text-sky-600 focus:outline-none focus:ring-4 focus:ring-sky-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300" data-i18n-aria="themeToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="hidden h-5 w-5 dark:block"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5 dark:hidden"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </header>

    <section class="grid gap-6 lg:grid-cols-[1.12fr_.88fr]">
      <div class="app-card p-5 sm:p-7">
        <div class="mb-6"><h2 class="mt-4 text-2xl font-extrabold tracking-tight sm:text-[1.75rem]" data-i18n="heroTitle"></h2><p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600 dark:text-slate-400"><span data-i18n="heroDescriptionBefore"></span> <code class="rounded bg-slate-100 px-1.5 py-0.5 font-bold text-sky-700 dark:bg-slate-800 dark:text-sky-400">px</code><span data-i18n="heroDescriptionAfter"></span></p></div>
        <label id="dropzone" for="fileInput" class="group flex min-h-52 cursor-pointer flex-col items-center justify-center rounded-lg border border-dashed border-slate-300 bg-slate-50/80 px-5 text-center shadow-inner transition hover:border-sky-500 hover:bg-slate-100 focus-within:ring-4 focus-within:ring-sky-500/15 dark:border-slate-600 dark:bg-[#111b24]/80 dark:hover:border-sky-500 dark:hover:bg-slate-900">
          <div class="mb-4 grid h-14 w-14 place-items-center rounded-lg bg-white text-slate-800 shadow-md transition group-hover:-translate-y-1 dark:bg-slate-800 dark:text-slate-200"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-7 w-7"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16V4m0 0L7 9m5-5 5 5M5 20h14"/></svg></div>
          <span class="font-bold" data-i18n="dropTitle"></span><span class="mt-1 text-sm text-slate-500 dark:text-slate-400" data-i18n="dropSubtitle"></span>
          <input id="fileInput" class="sr-only" type="file" accept=".csv,text/csv" multiple>
        </label>
        <div class="mt-5 rounded-lg border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
          <label for="removePyGuid" class="flex cursor-pointer items-start gap-3"><input id="removePyGuid" type="checkbox" checked class="mt-0.5 h-5 w-5 rounded border-slate-300 accent-sky-600"><span><span class="block text-sm font-bold" data-i18n="pyGuidTitle"></span><span class="mt-0.5 block text-xs leading-5 text-slate-500 dark:text-slate-400" data-i18n="pyGuidDescription"></span></span></label>
        </div>
        <div class="mt-4 flex flex-col gap-3 sm:flex-row"><button id="cleanBtn" disabled class="flex-1 rounded-lg bg-gradient-to-r from-[#076bc9] via-[#0660ad] to-[#054a8a] px-5 py-3.5 font-bold text-white shadow-lg shadow-sky-950/25 transition hover:-translate-y-0.5 hover:from-[#1689c9] hover:to-[#076bc9] disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:translate-y-0" data-i18n="cleanButton"></button><button id="clearBtn" disabled class="rounded-lg border border-slate-200 bg-white px-5 py-3.5 font-bold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700" data-i18n="clearButton"></button></div>
      </div>

      <aside class="app-card p-5 sm:p-7"><div class="flex items-center justify-between"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-slate-400" data-i18n="filesEyebrow"></p><h2 class="mt-1 text-lg font-extrabold" data-i18n="filesTitle"></h2></div><span id="count" class="grid h-9 min-w-9 place-items-center rounded-full bg-slate-200 px-3 text-sm font-black text-slate-800 dark:bg-slate-800 dark:text-slate-200">0</span></div><div id="empty" class="grid min-h-64 place-items-center text-center"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="mx-auto h-10 w-10 text-slate-300 dark:text-slate-700"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><p class="mt-3 text-sm font-semibold text-slate-500" data-i18n="emptyState"></p></div></div><div id="fileList" class="mt-5 hidden max-h-[390px] space-y-3 overflow-auto pr-1"></div><div id="summary" class="mt-5 hidden rounded-lg bg-slate-100 p-4 text-sm text-slate-800 dark:bg-slate-800 dark:text-slate-200" role="status"></div></aside>
    </section>
    <footer class="mt-7 text-center text-xs leading-5 text-slate-500" data-i18n="footer"></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
